<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="utf-8" />
    <title>Nuketown 2025 — Standalone</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden}
      canvas{display:block;width:100%;height:100%}
      #hud{position:fixed;left:12px;top:10px;font:12px ui-monospace,Menlo,Consolas,monospace;
           color:#cfe3ff;text-shadow:0 1px 2px #000;pointer-events:none;line-height:1.5;z-index:5}
      #crosshair{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:5;
           pointer-events:none;opacity:.85}
      #crosshair:before,#crosshair:after{content:"";position:absolute;background:#eaf4ff;
           box-shadow:0 0 2px #000}
      #crosshair:before{left:6px;top:0;width:2px;height:14px}
      #crosshair:after{left:0;top:6px;width:14px;height:2px}
      #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
           background:radial-gradient(circle at 50% 40%,#1b2430,#070a0d);color:#e8eef7;z-index:10;
           font:16px system-ui,sans-serif;flex-direction:column;gap:10px}
      #start h1{font:700 40px/1 system-ui,sans-serif;letter-spacing:.5px;margin:0;color:#ff8a5c}
      #start p{margin:0;opacity:.75}
      #start .ctl{font-size:13px;line-height:1.7;opacity:.8;text-align:center}
      #start .ctl b{color:#ffd9a8;font-weight:600}
      #start .fan{font-size:12px;opacity:.55}
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="hud"></div>
    <div id="start"><h1>ATOMIC ACRES</h1><p role="status">Loading Nuketown 2025…</p><div class="fan">Unofficial fan project — not affiliated with Activision or Treyarch.</div></div>
    <script>
      // This boundary also works when the module entry itself cannot download.
      (() => {
        let stopped = false;
        const fail = () => {
          if (stopped) return;
          stopped = true;
          clearTimeout(timer);
          const status = document.querySelector('#start > [role="status"]');
          if (!status) return;
          status.setAttribute('data-boot-error', 'true');
          status.textContent = 'Game files could not load. Retry loading.';
          const retry = document.createElement('button');
          retry.type = 'button'; retry.textContent = 'Retry loading';
          retry.addEventListener('click', () => location.reload());
          status.after(retry);
        };
        const timer = setTimeout(fail, 45000);
        addEventListener('error', event => {
          if (event.target instanceof HTMLScriptElement && event.target.dataset.gameEntry === 'true') fail();
        }, true);
        addEventListener('atomic-acres:boot-started', () => { stopped = true; clearTimeout(timer); }, { once: true });
      })();
    </script>
    <script type="module" data-game-entry="true" src="/src/boot.ts"></script>
  </body>
</html>
